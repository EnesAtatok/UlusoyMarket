  <!-- Giriş -->
  <main id="loginView" class="login" hidden>
    <form id="loginForm" class="login-card" novalidate>
      <img class="login-logo" src="/img/icon-192.png" alt="Ulusoy Market logosu" width="96" height="96" />
      <h1>Ulusoy Market<span>Yönetim paneli</span></h1>
      <p id="loginNotice" class="login-notice" role="status" hidden></p>
      <label class="field"><span>Kullanıcı adı</span>
        <input id="loginUser" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" required value="admin" />
      </label>
      <label class="field"><span>Şifre</span>
        <span class="pw-wrap">
          <input id="loginPass" name="password" type="password" autocomplete="current-password" required />
          <button type="button" class="pw-toggle" id="loginPwToggle" aria-label="Şifreyi göster"><svg class="i"><use href="#i-eye"/></svg></button>
        </span>
      </label>
      <p id="loginError" class="form-error" role="alert"></p>
      <button class="btn btn-primary btn-block" id="loginBtn">Giriş yap</button>
      <a class="login-store" href="/">Mağazaya dön</a>
    </form>
  </main>

  <!-- Uygulama -->
  <div id="app" class="app" hidden>
    <aside class="side" aria-label="Ana menü">
      <a class="brand" href="/panel/siparisler" data-nav="siparisler">
        <img src="/img/icon-192.png" alt="" width="40" height="40" />
        <span class="brand-text"><b>Ulusoy Market</b><small>Panel</small></span>
      </a>
      <nav class="side-nav" id="sideNav"></nav>
      <div class="side-foot">
        <a class="side-link" href="/" target="_blank" rel="noopener"><svg class="i"><use href="#i-store"/></svg><span>Mağazayı aç</span></a>
        <button class="side-link" type="button" data-action="logout"><svg class="i"><use href="#i-logout"/></svg><span>Çıkış</span></button>
      </div>
    </aside>

    <div class="main-col">
      <header class="topbar">
        <img class="topbar-logo" src="/img/icon-192.png" alt="" width="32" height="32" />
        <h1 class="topbar-title" id="pageTitle">Siparişler</h1>
        <div class="topbar-tools">
          <button type="button" class="sec-chip" id="secChip" hidden><svg class="i"><use href="#i-shield-alert"/></svg><span class="n"></span><span class="lbl">uyarı</span></button>
          <button type="button" class="live" id="liveInd" data-state="poll" title="Canlı bağlantı durumu"><span class="dot"></span><span class="lbl">Bağlanıyor…</span></button>
          <button type="button" class="store-pill" id="storePill" title="Sipariş alım durumu"><span class="dot"></span><span class="lbl">…</span><span class="lbl-s">…</span></button>
          <button type="button" class="icon-btn" id="soundBtn" aria-pressed="true" aria-label="Sesli uyarı açık"><svg class="i"><use href="#i-volume"/></svg></button>
          <button type="button" class="icon-btn" id="notifyBtn" aria-label="Tarayıcı bildirimlerine izin ver" hidden><svg class="i"><use href="#i-bell"/></svg></button>
          <span class="user-chip" id="userChip"></span>
        </div>
      </header>
      <div id="secBar" class="secbar" role="region" aria-label="Güvenlik ve yasal uyarılar" hidden></div>
      <div id="audioHint" class="audio-hint" hidden>
        <svg class="i"><use href="#i-volume"/></svg>
        <span>Yeni sipariş sesinin çalabilmesi için sayfada bir kez dokunun.</span>
        <button type="button" class="btn btn-sm" id="audioHintBtn">Sesi etkinleştir</button>
      </div>
      <main class="content" id="content" tabindex="-1"></main>
    </div>

    <nav class="bottom-nav" id="bottomNav" aria-label="Alt menü"></nav>
  </div>

  <div id="toasts" class="toasts" role="status" aria-live="polite" aria-atomic="false"></div>
  <div id="printArea" class="print-area" aria-hidden="true"></div>
</body>
</html>
